name: hourly-sweep
# Hits the idempotent sweep endpoint so cash reminders, the 48h customer check and nearest-request expiry run on time.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call sweep endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 60 https://fanni-marketplace.vercel.app/api/cron/autoconfirm
